name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The repository still has the legacy branch publisher enabled. It can
      # otherwise overwrite the Vite artifact after this workflow succeeds.
      - name: Wait for legacy Pages publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..36}; do
            legacy_status="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" \
                --jq '[.workflow_runs[] | select(.name == "pages build and deployment") | .status][0] // "missing"'
            )"

            if [[ "$legacy_status" == "completed" ]]; then
              exit 0
            fi

            if [[ "$legacy_status" == "missing" && "$attempt" -ge 6 ]]; then
              exit 0
            fi

            sleep 5
          done

          echo "Legacy Pages publisher did not finish in time" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed application bundle
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..24}; do
            page="$(curl --fail --silent --show-error --location "${SITE_URL%/}/?build=${GITHUB_SHA}&attempt=${attempt}")"

            if grep --quiet 'src="/assets/index-' <<< "$page" \
              && ! grep --quiet 'src="/app.js"' <<< "$page"; then
              exit 0
            fi

            sleep 5
          done

          echo "Deployed page is not using the Vite application bundle" >&2
          exit 1
